apiVersion: batch/v1
kind: Job
metadata:
  name: run-migration-job
  namespace: market-saas
spec:
  template:
    spec:
      containers:
      - name: migration-job
        image: swr.cn-north-4.myhuaweicloud.com/cloud-blh/market-saas-backend:v0.5
        command:
        - /bin/bash
        - '-c'
        - |
          echo "开始执行迁移..."
          export PERFORM_MIGRATION=true
          ./scripts/entrypoint.sh
          echo "迁移完成"
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database
              key: DATABASE_URL
      restartPolicy: Never
  backoffLimit: 1 